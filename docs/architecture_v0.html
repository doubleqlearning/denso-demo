<!DOCTYPE html>

<head>
<meta charset="UTF-8" />

<title>Expert Knowledge Management Architecture</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #f5f6f8; }
  .diagram-wrapper { width: 100%; overflow-x: auto; }
  svg {
    display: block; width: 100%; max-width: 1740px; height: auto; margin: 0 auto;
    background: #fff; border: 1px solid #dde3ea;
    font-family: Helvetica, Arial, sans-serif;
  }
  text { text-anchor: middle; }

  /* sections */
  .sec { stroke-width: 1.5; }
  .sec.blue   { fill: #f1f6fc; stroke: #6c8ebf; }
  .sec.green  { fill: #f3f9f1; stroke: #82b366; }
  .sec.orange { fill: #fff6e9; stroke: #d79b00; }
  .sec.teal   { fill: #eef9f8; stroke: #5fb3ad; }
  .st { font-size: 20px; font-weight: 700; text-anchor: start; }
  .st.blue { fill: #1f4e8c; } .st.green { fill: #2d6a2d; }
  .st.orange { fill: #a8531a; } .st.teal { fill: #1b6b68; }
  .ss { font-size: 13px; fill: #5b6b7b; text-anchor: start; }

  /* nodes */
  .node { stroke-width: 1.5; }
  .n-blue    { fill: #dae8fc; stroke: #6c8ebf; }
  .n-bluew   { fill: #fff;    stroke: #6c8ebf; }
  .n-greenw  { fill: #fff;    stroke: #82b366; }
  .n-orangew { fill: #fff;    stroke: #d79b00; }
  .n-red     { fill: #f8cecc; stroke: #b85450; }
  .n-purple  { fill: #e1d5e7; stroke: #9673a6; }
  .t { font-size: 14px; font-weight: 700; fill: #1f2d3d; }
  .t.big { font-size: 17px; }
  .s { font-size: 12px; fill: #4d5d6e; }
  .title { font-size: 28px; font-weight: 700; fill: #1f4e8c; }

  /* database */
  .db { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.5; }
  .db-top { fill: none; stroke: #6c8ebf; stroke-width: 1.5; }

  /* connectors */
  path[class^="a-"] { fill: none; stroke-width: 2; stroke-linejoin: round; marker-end: url(#h-blue); }
  .a-blue  { stroke: #2a6ebb; }
  .a-green { stroke: #2e8b57; marker-end: url(#h-green); }
  .a-red   { stroke: #d64545; marker-end: url(#h-red); }
  .nohead  { marker-end: none !important; }
  .dashed  { stroke-dasharray: 7 5; }

  .lb { font-size: 11px; font-weight: 600; }
  .l-blue  { fill: #2a6ebb; }
  .l-green { fill: #2e8b57; }
  .l-red   { fill: #d64545; font-weight: 700; }
</style>
</head>
